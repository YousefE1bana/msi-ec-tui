[package]
name = "mec"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "A safe capability-aware terminal control center for MSI laptops on Linux"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = "0.3"
directories = "6.0"
ctrlc = "3"

[dev-dependencies]
tempfile = "3.20"
assert_cmd = "2.0"
predicates = "3.1"

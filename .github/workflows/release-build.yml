# Builds multi-arch release artifacts and validates checksums.
#
# Builds artifacts only: this workflow never creates a GitHub Release,
# even when triggered by a version tag. Publishing stays a deliberate
# later step.

name: Release build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: packages (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu]
    steps:
      # actions/checkout v4 (major-version pinned upstream action).
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Show pinned toolchain
        run: rustup show
      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Install cross linker and packaging tools
        # sudo apt on the disposable runner installs distro build tools
        # only; packaging scripts themselves never use sudo.
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu dpkg-dev rpm cpio
      - name: Build release archive
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          chmod +x scripts/build-release-archive.sh
          ./scripts/build-release-archive.sh ${{ matrix.target }} dist
      - name: Build deb and rpm from release binary
        run: |
          chmod +x scripts/build-deb.sh scripts/build-rpm.sh
          ./scripts/build-deb.sh \
            target/${{ matrix.target }}/release/mec \
            ${{ matrix.target }} dist
          ./scripts/build-rpm.sh \
            target/${{ matrix.target }}/release/mec \
            ${{ matrix.target }} dist
      # actions/upload-artifact v4 (major-version pinned upstream action).
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.target }}
          path: dist
          if-no-files-found: error

  checksums:
    name: checksums
    runs-on: ubuntu-latest
    needs: build
    steps:
      # actions/checkout v4 (major-version pinned upstream action).
      - name: Check out repository
        uses: actions/checkout@v4
      # actions/download-artifact v4 (major-version pinned upstream action).
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist
      - name: Generate and verify SHA256SUMS
        run: |
          chmod +x scripts/generate-checksums.sh
          VERSION="$(grep '^version = ' Cargo.toml | head -1 | cut -d'"' -f2)"
          ./scripts/generate-checksums.sh dist \
            mec-x86_64-unknown-linux-gnu.tar.gz \
            mec-aarch64-unknown-linux-gnu.tar.gz \
            "mec_${VERSION}_amd64.deb" \
            "mec_${VERSION}_arm64.deb" \
            "mec-${VERSION}-1.x86_64.rpm" \
            "mec-${VERSION}-1.aarch64.rpm"
          (cd dist && sha256sum -c SHA256SUMS)
          ls dist
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mec-release-packages
          path: dist
          if-no-files-found: error

# Builds multi-arch release artifacts and validates checksums.
#
# Builds artifacts only: this workflow never creates a GitHub Release,
# even when triggered by a version tag. Publishing stays a deliberate
# later step.

name: Release build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: packages (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu]
    steps:
      # actions/checkout v4 (major-version pinned upstream action).
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Show pinned toolchain
        run: rustup show
      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Install cross linker and packaging tools
        # sudo apt on the disposable runner installs distro build tools
        # only; packaging scripts themselves never use sudo.
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu dpkg-dev rpm cpio
      - name: Build release archive
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          chmod +x scripts/build-release-archive.sh
          ./scripts/build-release-archive.sh ${{ matrix.target }} dist
      - name: Build deb and rpm from release binary
        run: |
          chmod +x scripts/build-deb.sh scripts/build-rpm.sh
          ./scripts/build-deb.sh \
            target/${{ matrix.target }}/release/mec \
            ${{ matrix.target }} dist
          ./scripts/build-rpm.sh \
            target/${{ matrix.target }}/release/mec \
            ${{ matrix.target }} dist
      - name: Validate target artifacts
        run: |
          set -euo pipefail
          VERSION="$(grep '^version = ' Cargo.toml | head -1 | cut -d'"' -f2)"
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-gnu) DEB_ARCH=amd64; RPM_ARCH=x86_64 ;;
            aarch64-unknown-linux-gnu) DEB_ARCH=arm64; RPM_ARCH=aarch64 ;;
            *) echo "unknown target" >&2; exit 1 ;;
          esac
          test -f "dist/mec-${{ matrix.target }}.tar.gz"
          test -f "dist/mec_${VERSION}_${DEB_ARCH}.deb"
          test -f "dist/mec-${VERSION}-1.${RPM_ARCH}.rpm"
          test "$(dpkg-deb -f "dist/mec_${VERSION}_${DEB_ARCH}.deb" Architecture)" = "$DEB_ARCH"
          test "$(rpm -qp --queryformat '%{ARCH}\n' "dist/mec-${VERSION}-1.${RPM_ARCH}.rpm")" = "$RPM_ARCH"
          test "$(tar -tzf "dist/mec-${{ matrix.target }}.tar.gz" | LC_ALL=C sort)" = "$(printf 'mec-%s-%s/\nmec-%s-%s/LICENSE\nmec-%s-%s/README.md\nmec-%s-%s/SECURITY.md\nmec-%s-%s/mec\n' "$VERSION" "${{ matrix.target }}" "$VERSION" "${{ matrix.target }}" "$VERSION" "${{ matrix.target }}" "$VERSION" "${{ matrix.target }}" "$VERSION" "${{ matrix.target }}")"
      - name: Execute native binary (x86_64 only)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          set -euo pipefail
          rm -rf /tmp/mec-validate && mkdir -p /tmp/mec-validate
          tar -xzf dist/mec-x86_64-unknown-linux-gnu.tar.gz -C /tmp/mec-validate
          VERSION="$(grep '^version = ' Cargo.toml | head -1 | cut -d'"' -f2)"
          BIN="/tmp/mec-validate/mec-${VERSION}-x86_64-unknown-linux-gnu/mec"
          "$BIN" --help
          "$BIN" --sys-root tests/fixtures/gf63 status
      # actions/upload-artifact v4 (major-version pinned upstream action).
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.target }}
          path: dist
          if-no-files-found: error

  checksums:
    name: checksums
    runs-on: ubuntu-latest
    needs: build
    steps:
      # actions/checkout v4 (major-version pinned upstream action).
      - name: Check out repository
        uses: actions/checkout@v4
      # actions/download-artifact v4 (major-version pinned upstream action).
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist
      - name: Generate and verify SHA256SUMS
        run: |
          chmod +x scripts/generate-checksums.sh
          VERSION="$(grep '^version = ' Cargo.toml | head -1 | cut -d'"' -f2)"
          ./scripts/generate-checksums.sh dist \
            mec-x86_64-unknown-linux-gnu.tar.gz \
            mec-aarch64-unknown-linux-gnu.tar.gz \
            "mec_${VERSION}_amd64.deb" \
            "mec_${VERSION}_arm64.deb" \
            "mec-${VERSION}-1.x86_64.rpm" \
            "mec-${VERSION}-1.aarch64.rpm"
          (cd dist && sha256sum -c SHA256SUMS)
          ls dist
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mec-release-packages
          path: dist
          if-no-files-found: error
